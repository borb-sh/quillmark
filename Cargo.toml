[workspace]
members = [
    "crates/core",
    "crates/quillmark",
    "crates/quillmark-pdf",
    "crates/backends/typst",
    "crates/backends/acroform",
    "crates/content",
    "crates/fixtures",
    "crates/bindings/wasm",
    "crates/bindings/python",
    "crates/bindings/cli",
]
# The default members to include when running `cargo build` or `cargo test` in the workspace root.
default-members = [
    "crates/core",
    "crates/quillmark",
    "crates/quillmark-pdf",
    "crates/backends/typst",
    "crates/backends/acroform",
    "crates/bindings/cli",
]
resolver = "2"

[workspace.package]
version = "0.133.0"
edition = "2024"
# No `rust-version`: nothing rebuilds the workspace on a floor to verify one,
# and the resolver enforces an unverified floor on consumers.
include = ["src/**", "Cargo.toml", "README*", "LICENSE*", "NOTICE"]
readme = "README.md"
license = "Apache-2.0"
homepage = "https://quillmark.dev/"

[workspace.dependencies]
serde = { version = "~1.0", features = ["derive"] }
serde-saphyr = "~2.0"
serde_json = { version = "~1.0", features = ["preserve_order"] }
jsonschema = { version = "~0.60", default-features = false }
thiserror = "~2.0"
toml = "~1.1"
glob = "0.3.3"
unicode-normalization = "0.1"

# Preserves insertion order, so serialization is deterministic.
indexmap = { version = "2", features = ["serde"] }

# Char-level diff (Myers/LCS) for richtext edit deltas.
similar = "3.1"

# The content hash a guarded revise checks; already in the render graph
# through Typst.
sha2 = "0.11"

# Ships the SPDX license list `quill.license` is checked against, and a patch
# release can bring a newer list: an id it adds loads on builds carrying it and
# is refused on older ones, and an id it deprecates loads with a warning.
spdx = "0.13.6"

# The `.quill` bundle's deflate and CRC-32: both already in the render graph
# through Typst, so the core artifact adds them and the render one adds nothing.
miniz_oxide = "0.8.9"
crc32fast = "1.5"

pulldown-cmark = "0.13.0"
# pulldown-cmark's own label fold, so a footnote reference finds the
# definition the parser matched it to.
unicase = "2.6"
time = { version = "0.3.44", features = ["formatting", "parsing"] }
# Pinned to the version the Typst toolchain (typst-pdf → krilla) already forces,
# so the workspace links a single copy of the PDF writer.
pdf-writer = "0.15.0"
typst = "0.15.1"
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-render = "0.15.1"
typst-svg = "0.15.1"

# Intra-project dependencies
quillmark-core = { version = "0.133.0", path = "crates/core" }
quillmark-content = { version = "0.133.0", path = "crates/content" }
quillmark-pdf = { version = "0.133.0", path = "crates/quillmark-pdf" }
quillmark-typst = { version = "0.133.0", path = "crates/backends/typst" }
quillmark-acroform = { version = "0.133.0", path = "crates/backends/acroform" }
quillmark = { version = "0.133.0", path = "crates/quillmark" }

# The key that keeps a host library face's family unspellable by a plate. The
# WASM binding enables `wasm_js`, the backend a library crate leaves to its
# final binary.
getrandom = "0.4"

# WASM host seam. Target-gated in the Typst backend, unconditional in the
# binding; one pin either way.
js-sys = "0.3"
wasm-bindgen = "0.2"

tempfile = "~3.27"
proptest = "~1.12"
quillmark-fixtures = { path = "crates/fixtures" }
# PDF *reader*, test-only: reparses stamped output to assert on it. The
# production writer is `pdf-writer`; the two are not interchangeable.
lopdf = "0.46"

roxmltree = "0.21"

[profile.dev]
split-debuginfo = "unpacked" # Faster on macOS/Linux
[profile.dev.package."*"]
debug = false
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true

# Size, not speed: this is the published bundle.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
[profile.wasm-release.package."*"]
opt-level = "z"

# Fast-compiling WASM profile for CI / local iteration. Produces a larger,
# unoptimized binary: only correctness matters here, not size.
[profile.wasm-ci]
inherits = "dev"
opt-level = 0
lto = false
codegen-units = 16
panic = "abort"      # Required: wasm32 has no unwinding
debug = false        # Smaller artifacts, faster link
strip = "debuginfo"
incremental = false  # Matches CARGO_INCREMENTAL=0 in CI
