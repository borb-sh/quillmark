# Cut a release: bump the workspace version, seed the changelog section, push the
# release branch, and open the PR. Merging that PR is what tags and publishes
# (release.yml).
#
# Opening it needs Settings → Actions → "Allow GitHub Actions to create and approve
# pull requests", which no `permissions:` block grants. A PR opened by `GITHUB_TOKEN`
# gets no `pull_request` run, so the same step dispatches ci.yml at the branch: the
# release PR is the one change that must not merge unchecked.
name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type (ignored while iterating an existing RC, or when version_override is set)
        required: true
        type: choice
        options:
          - patch
          - minor
      release_candidate:
        description: Cut a release candidate (-rc.N) instead of a final release
        required: false
        type: boolean
        default: false
      version_override:
        description: Explicit next version (e.g. 0.94.0), used verbatim and overriding bump, set to skip a minor
        required: false
        type: string
        default: ""

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # The ci.yml dispatch.
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-release
        uses: taiki-e/install-action@v2.87.2
        with:
          tool: cargo-release

      - name: Compute next version
        id: version
        run: |
          CURRENT=$(cargo metadata --format-version=1 --no-deps \
            | jq -r '.packages[] | select(.name == "quillmark") | .version')

          NEXT=$(./scripts/next-version.sh "$CURRENT" \
            "${{ inputs.bump }}" \
            "${{ inputs.release_candidate }}" \
            "${{ inputs.version_override }}")

          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT → $NEXT"

      - name: Bump workspace versions
        run: |
          cargo release version "${{ steps.version.outputs.next }}" \
            --workspace \
            --no-confirm \
            --execute

      - name: Seed changelog entry
        run: |
          VERSION="${{ steps.version.outputs.next }}"
          DATE=$(date +%Y-%m-%d)

          # Changelog baseline: the last FINAL release, so the commit range
          # spans the release candidates cut since it. Empty before the first
          # release, which the range below reads as "since the first commit".
          LAST=$(git tag -l --sort=-v:refname | ./scripts/last-release-tag.sh)

          [ -f CHANGELOG.md ] || printf '# Changelog\n\n' > CHANGELOG.md

          # A seed comment left in place last cycle is still on main: release.yml
          # strips only the notes it derives, main's ruleset admitting no push
          # outside a pull request. Stripping here keeps a new section from
          # splicing on top of one.
          ./scripts/strip-seed-comment.sh CHANGELOG.md

          # A curated "## Unreleased" section is the seed body: its entries
          # become the version section (and the GitHub Release notes), with the
          # raw commit list riding below in an HTML comment as a coverage
          # cross-check, invisible in rendered notes if left unedited. With no
          # curated section, the commit list is the seed body itself.
          # Only the first "## Unreleased" is consumed; any later one is
          # stray data and passes through untouched rather than corrupting
          # the seed.
          awk '!done && /^## Unreleased$/{f=1; done=1; next} /^## /{f=0} f' CHANGELOG.md > unreleased.md
          awk '!done && /^## Unreleased$/{f=1; done=1; next} /^## /{f=0} !f' CHANGELOG.md > CHANGELOG.stripped

          {
            echo "## v${VERSION} - ${DATE}"
            echo
            if grep -q '[^[:space:]]' unreleased.md; then
              sed -e '/./,$!d' unreleased.md
              echo "<!-- seed: commits since ${LAST:-the first commit}, confirm the entries above cover them, then delete this comment"
              git log --no-merges --pretty='- %s' ${LAST:+"${LAST}..HEAD"}
              echo "-->"
            else
              git log --no-merges --pretty='- %s' ${LAST:+"${LAST}..HEAD"}
            fi
            echo
          } > entry.md

          # Splice the new section in directly after the "# Changelog" title.
          { head -n1 CHANGELOG.stripped; echo; cat entry.md; tail -n +2 CHANGELOG.stripped; } \
            > CHANGELOG.new && mv CHANGELOG.new CHANGELOG.md
          rm -f entry.md unreleased.md CHANGELOG.stripped

          echo "Seeded changelog entry for v${VERSION}:"
          cat CHANGELOG.md

      - name: Push branch and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.next }}"
          BRANCH="release/v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore(release): v${VERSION}"
          git push -u origin "$BRANCH"

          gh pr create \
            --title "chore(release): v${VERSION}" \
            --body "Automated version bump to \`v${VERSION}\`.

          **Before merging:** review and edit the \`v${VERSION}\` section at the top of \`CHANGELOG.md\` on this branch, seeded from the curated \`## Unreleased\` section when one exists (raw commits ride in an HTML comment as a coverage check), else from the raw commit list. The final section becomes the GitHub Release notes.

          Read that section **as a whole against HEAD**, not entry by entry: later commits in a cycle supersede earlier entries, and only the whole read catches one.

          - An entry asserting a symbol's current state must be true at HEAD. \`grep\` each symbol it names.
          - Naming a deleted symbol is correct when the entry is the one deleting it. The tense separates the two.
          - The seed comment checks commits against entries, never entries against HEAD.
          - Each \`!\` entry reconciles against \`docs/migrations/<prev>-to-<next>.md\`, which carries the same break for an upgrading consumer.

          Merging this PR will tag and publish the release.

          The checks here come from a dispatched \`CI\` run at the branch head: a PR opened by \`GITHUB_TOKEN\` gets no \`pull_request\` run." \
            --base main \
            --head "$BRANCH"

          # The checks, dispatched rather than triggered. Only this first commit
          # needs it; a later push to the branch is a human's and fires
          # `synchronize`.
          gh workflow run ci.yml --ref "$BRANCH"
