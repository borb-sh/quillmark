[package]
name = "quillmark-automerge"
version.workspace = true
edition.workspace = true
include.workspace = true
license.workspace = true
homepage.workspace = true
repository = "https://github.com/borb-sh/quillmark"
keywords = ["richtext", "crdt", "automerge", "content-model"]
categories = ["text-processing"]
description = "A Quillmark content value held in an Automerge document: the mapping, the write that lowers a change into it, and the merged read through repair"
# Published because `quillmark-core` (published) depends on it.
publish = true

[dependencies]
quillmark-content = { workspace = true }
automerge = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
