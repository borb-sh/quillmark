[package]
name = "quillmark-content"
version.workspace = true
edition.workspace = true
include.workspace = true
license.workspace = true
homepage.workspace = true
repository = "https://github.com/borb-sh/quillmark"
keywords = ["richtext", "markdown", "content-model", "text-editing"]
categories = ["text-processing", "parser-implementations"]
description = "The Quillmark content model: text, blocks, marks, anchors and islands; its canonical JSON, changes, rebase and repair; and the markdown and plain codecs"
# The leaf content-model crate: `quillmark-core` depends on it for the storage
# body type, so it carries no dependency on the rest of the framework. Published
# because `quillmark-core` (published) depends on it.
publish = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# The markdown projection's parser. This crate is the workspace's single home
# for a CommonMark parser; render paths consume the content, never markdown.
pulldown-cmark = { workspace = true }
unicase = { workspace = true }
similar = { workspace = true }
unicode-segmentation = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
quillmark-fixtures = { workspace = true }
