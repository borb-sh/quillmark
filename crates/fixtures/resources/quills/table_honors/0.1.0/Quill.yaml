quill:
  name: table_honors
  version: 0.1.0
  backend: typst
  description: Declares every table and cell knob and two elements, so each lowers through the full pipeline

typst:
  plate_file: plate.typ

honors:
  table: [widths, align, breakable]
  cell: [align, valign]
  elements:
    keep:
      scope: block
    hl:
      scope: inline
      attrs:
        tone: { type: enum, values: [warm, cool], default: warm }

main:
  fields:
    title:
      description: title of document
      type: string
