[package]
name = "quillmark-pdf"
version.workspace = true
edition.workspace = true
include.workspace = true
readme.workspace = true
description = "Typst-free AcroForm stamping spine for Quillmark: (base_pdf, &[FieldSpec]) -> stamped PDF + regions"
license.workspace = true
documentation = "https://docs.rs/quillmark-pdf"
homepage.workspace = true
repository = "https://github.com/borb-sh/quillmark"
keywords = ["pdf", "acroform", "forms", "form-filling"]
categories = ["rendering"]
publish = true

[dependencies]
quillmark-core = { workspace = true }
pdf-writer = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
lopdf = { workspace = true }
proptest = { workspace = true }
quillmark-fixtures = { workspace = true }
